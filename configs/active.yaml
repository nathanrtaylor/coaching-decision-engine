# configs/active.yaml
# Single pointer file that selects the current governed configuration set.
# This should be the only config file ops/engineering “flip” to change behavior quickly.

mappings:
  source_catalog: mappings/source_catalog.yaml
  metric_catalog: mappings/metric_catalog.yaml
  topic_map: mappings/topic_map.yaml
  benchmarks: mappings/benchmarks.yaml

thresholds: thresholds/signal_thresholds.yaml
priorities: priorities/v2026_02_16_baseline.yaml

# Optional: benchmarks can live here or in a separate file.
# If you prefer a separate file, add it under mappings and load it similarly.
benchmarks:
  transfer_rate:
    default: 0.12
    by_call_type:
      claims: 0.10
      tech_support: 0.14
  resolution_rate:
    default: 0.78
    by_call_type:
      claims: 0.80
      tech_support: 0.75
  guided_flow_adoption:
    default: 0.65
  expert_assist_usage:
    default: 0.40
  smart_offer_adoption:
    default: 0.30

# Entity keys used across sources (if consistent). If not, set per-source in source_catalog.
entity_keys:
  agent_id: agent_id
  period: week_start

call_type_column: call_type

signal_window:
  volatility_periods: 4

# Topic map behavior (recommended defaults)
topic_map_options:
  allow_unmapped_metrics: false

# Eligibility rules (hard gates)
eligibility:
  min_confidence: 0.55

# Dampening rules (optional; usually enabled once you have coaching history)
dampening:
  mode: suppress     # suppress | multiply
  periods: 2
  multiplier: 0.5

# Deterministic scoring composition used for candidate ranking (transparent)
priority_model:
  w_level: 0.5
  w_trend: 0.2
  w_risk: 0.3
  w_confidence: 0.0

risk_model:
  alpha_level: 0.7
  beta_trend: 0.3

# Tie-breakers (optional: stable preference order when scores are tied)
tie_breakers:
  # topic_order can be omitted; engine will sort lexicographically for final stability
  topic_order:
    - "Reduce Transfer Rate"
    - "Improve Resolution Rate"
    - "Reduce Cancel Rate"
    - "Increase Guided Flow Adoption"
    - "Increase Expert Assist Usage"
    - "Improve Smart Offer Adoption"
    - "Strengthen Empathy Statements"
    - "Use Clear Transition Statements"

# Conversation types can be overridden by topic_map.topic_to_conversation_type,
# but having a deterministic default here is useful.
conversation_types:
  default: "Performance Coaching"
  by_topic:
    "Reduce Transfer Rate": "Performance Correction"
    "Reduce Cancel Rate": "Performance Correction"
    "Increase Guided Flow Adoption": "Tool Enablement"
    "Increase Expert Assist Usage": "Tool Enablement"
    "Improve Smart Offer Adoption": "Tool Enablement"

# Explainability controls
explainability:
  top_competitors: 3

meta:
  version: v2026_02_16_baseline
  data_snapshot: 2026-02-16_weekly
  engine_version: 0.1.0
