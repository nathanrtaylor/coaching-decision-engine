metric_catalog:

  # ---------------------------------------------------
  # Canonical metric definitions (decision contract)
  # Topics are NOT defined here.
  # ---------------------------------------------------

  metrics:

    # =========================
    # BUSINESS METRICS (agent_metrics)
    # =========================

    transfer_rate:
      source: agent_metrics
      source_metric_key: "transfer_rate"
      category: business
      direction: lower_is_better
      unit: rate
      description: "Transfers / handled calls."
      required: true
      eligible_for_prioritization: true
      computation_override:
        expected_calculation: rate
        denominator_min: 50
      benchmark:
        type: config
        key: transfer_rate

    resolution_rate:
      source: agent_metrics
      source_metric_key: "resolution_rate"
      category: business
      direction: higher_is_better
      unit: rate
      description: "Resolved / eligible calls."
      required: true
      eligible_for_prioritization: true
      computation_override:
        expected_calculation: rate
        denominator_min: 30
      benchmark:
        type: config
        key: resolution_rate

    cancel_rate:
      source: agent_metrics
      source_metric_key: "cancel_rate"
      category: business
      direction: lower_is_better
      unit: rate
      description: "Cancellation rate during/after call."
      required: false
      eligible_for_prioritization: true
      computation_override:
        expected_calculation: rate
        denominator_min: 30
      benchmark:
        type: config
        key: cancel_rate


    # =========================
    # TOOL USAGE METRICS
    # =========================

    guided_flow_adoption:
      source: agent_metrics
      source_metric_key: "guided_flow_adoption"
      category: tool_usage
      direction: higher_is_better
      unit: rate
      description: "Guided Flow used / eligible calls."
      required: false
      eligible_for_prioritization: true
      computation_override:
        expected_calculation: rate
        denominator_min: 20
      benchmark:
        type: config
        key: guided_flow_adoption

    expert_assist_usage:
      source: expert_assist
      source_metric_key: "expert_assist_usage"
      category: tool_usage
      direction: higher_is_better
      unit: rate
      description: "Expert Assist used / eligible calls."
      required: false
      eligible_for_prioritization: true
      computation_override:
        expected_calculation: rate
        denominator_min: 20
      benchmark:
        type: config
        key: expert_assist_usage

    smart_offer_adoption:
      source: smart_offer
      source_metric_key: "smart_offer_adoption"
      category: tool_usage
      direction: higher_is_better
      unit: rate
      description: "Smart Offer shown/used / eligible calls."
      required: false
      eligible_for_prioritization: true
      computation_override:
        expected_calculation: rate
        denominator_min: 20
      benchmark:
        type: config
        key: smart_offer_adoption


    # =========================
    # QUALITY BEHAVIOR METRICS (default OFF)
    # =========================

    empathy_statement:
      source: behavior_scores
      source_metric_key: "empathy_statement"
      category: quality_behavior
      direction: higher_is_better
      unit: score
      description: "AI-scored empathy behavior."
      required: false
      eligible_for_prioritization: false
      computation_override:
        expected_calculation: score
      benchmark:
        type: distribution
        key: empathy_statement

    transition_statement:
      source: behavior_scores
      source_metric_key: "transition_statement"
      category: quality_behavior
      direction: higher_is_better
      unit: score
      description: "AI-scored transition behavior."
      required: false
      eligible_for_prioritization: false
      computation_override:
        expected_calculation: score
      benchmark:
        type: distribution
        key: transition_statement


  category_defaults:
    business:         { base_weight_class: high,   confidence_floor: 0.6 }
    tool_usage:       { base_weight_class: medium, confidence_floor: 0.5 }
    quality_behavior: { base_weight_class: low,    confidence_floor: 0.7 }

  governance:
    disallow_unknown_metrics: true
    disallow_prioritization_if_not_flagged: true
    require_direction: true
    require_category: true
    require_unit: true
    require_source: true
    require_source_metric_key: true
