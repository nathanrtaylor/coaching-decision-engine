# Benchmarks (reference/target values) per metric.
#
# Keyed by metric benchmark key -> default, with optional per-call-type overrides. Overrides are
# only consulted when call_type_mode is enabled (currently disabled in active.yaml). Values must be
# on the SAME scale/unit as the extracted metric value (calc). A benchmark that sits at an extreme
# percentile of the observed data is flagged at runtime by scoring/assemble._warn_benchmark_outliers.
#
# NOTE: values marked "scale-corrected" below were unit-mismatched and have been put back on the
# right scale as plausible placeholders. Ops should confirm the true business target for each.

benchmarks:
  transfer_rate:
    default: 0.12
  cancel_rate:
    default: 0.12
  erp:
    default: 90        # scale-corrected: was 0.8; erp is a 0-100 score (Ops: confirm target)
  one_call_resolution:
    default: 0.80      # recalibrated: was 0.2 (flagged 0% - too lenient). 80% first-call resolution ~ just above median.
  hold_time:
    default: 50
  talk_time:
    default: 1150      # recalibrated to ~median (was 900/p25 placeholder, over-flagged 75%); seconds (Ops: confirm target)
  callback_rate:
    default: 0.25      # recalibrated: was 0.10 (p17, flagged 83% - too strict). Anchored at ~median (Ops: confirm target).
  expert_5star:
    default: 4.5       # scale-corrected: was 0.8; expert_5star is a 1-5 star rating (Ops: confirm target)
  nsp100:
    default: 0.03      # scale-corrected: was 1.0. Value is net sales PER CALL (not per 100); 0.03 = ~3 sales/100 calls (~p67).
  crt:
    default: 1400      # recalibrated to ~median (was 1200/p34 placeholder, over-flagged 66%); seconds (Ops: confirm target)
  resolution_rate:
    default: 0.78
    by_call_type:      # the one real per-call-type benchmark set (used only if call_type_mode enabled)
      claims: 0.80
      tech_support: 0.75
  guided_flow_adoption:
    default: 0.65
  expert_assist_usage:
    default: 0.40
  smart_offer_adoption:
    default: 0.30
